[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arccraft-research-companion"
version = "0.1.0.dev1"
description = "Scientific freeze candidate for the ARCCRAFT research companion"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "fastapi==0.141.1", "uvicorn==0.41.0"]

[project.optional-dependencies]
research = ["pandas==3.0.1", "scipy==1.18.1", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
include = ["arccraft*"]

[tool.setuptools.package-data]
arccraft = ["calibration/*.json"]
